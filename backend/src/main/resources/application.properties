spring.application.name=trupload-api
server.port=8080

# Keep request logging useful during local development without exposing secrets.
logging.level.com.trupload=INFO

# Local development database. Replace these settings with the deployment database configuration.
spring.datasource.url=jdbc:h2:file:./data/trupload
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
