
# ---------------------------------------------------------------------------
# Application
# ---------------------------------------------------------------------------
spring.application.name=trupload-api
server.port=8082

# Keep request logging useful during local development without exposing secrets.
logging.level.com.trupload=INFO

# ---------------------------------------------------------------------------
# Authentication
# ---------------------------------------------------------------------------
# JWT_EXPIRATION_MS controls token lifetime; defaults to eight hours.
app.jwt.secret=TRUploadJwtKey2026A7f9K2mP8xQ4vN6zR1
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# ---------------------------------------------------------------------------
# SQL Server
# ---------------------------------------------------------------------------
# SQLSERVER_HOST, SQLSERVER_PORT, SQLSERVER_USERNAME, and SQLSERVER_PASSWORD
# configure the application's SQL Server connection.
app.sqlserver.url=jdbc:sqlserver://${SQLSERVER_HOST:gcpmsdbtrans01u}:${SQLSERVER_PORT:1433};databaseName=master;encrypt=true;trustServerCertificate=true
app.sqlserver.username=${SQLSERVER_USERNAME:csa}
app.sqlserver.password=${SQLSERVER_PASSWORD:password}

# ---------------------------------------------------------------------------
# Phase 2: RTR generation on the remote Windows server
# ---------------------------------------------------------------------------
# Host and paths on the machine that runs ie.exe.
trupload.rtr.remote-server=${RTR_REMOTE_SERVER:optmsctxman01qv}
trupload.rtr.remote-executable-path=${RTR_REMOTE_EXECUTABLE_PATH:D:/Program Files/Fleet Management/bin/ie.exe}
trupload.rtr.output-directory=${RTR_OUTPUT_DIRECTORY:D:/RTE}
trupload.rtr.file-extension=${RTR_FILE_EXTENSION:rtr}

# PowerShell client installed on the backend host; WinRM connects to the RTR server.
trupload.rtr.power-shell-executable=${RTR_POWERSHELL_EXECUTABLE:powershell.exe}

# Database credentials passed to ie.exe as /UID and /PWD.
# The selected database name is used as the DSN. Both variables are required.
trupload.rtr.database-username=${RTR_DATABASE_USERNAME:csa}
trupload.rtr.database-password=${RTR_DATABASE_PASSWORD:password}

# Optional WinRM credentials for the remote server.
# Leave both unset to use the backend process identity; if a username is set,
# its matching password must also be configured.
trupload.rtr.remote-username=${RTR_REMOTE_USERNAME:}
trupload.rtr.remote-password=${RTR_REMOTE_PASSWORD:}

# One local log file is written for each RTR-generation attempt.
trupload.rtr.log-directory=${RTR_LOG_DIRECTORY:D:/TRUpload/Logs/RTR}

# WinRM connection timeout and overall PowerShell execution timeout, in seconds.
trupload.rtr.connection-timeout-seconds=${RTR_CONNECTION_TIMEOUT:30}
trupload.rtr.execution-timeout-seconds=${RTR_EXECUTION_TIMEOUT:300}
